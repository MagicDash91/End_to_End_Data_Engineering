version: 2

sources:
  - name: silver
    description: Cleaned, de-duplicated entities written by the Spark bronze_to_silver job.
    schema: silver
    config:
      loaded_at_field: _silver_loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: customers
        columns:
          - name: customer_id
            data_tests: [unique, not_null]
      - name: products
        columns:
          - name: product_id
            data_tests: [unique, not_null]
      - name: orders
        columns:
          - name: order_id
            data_tests: [unique, not_null]
      - name: order_items
        columns:
          - name: order_item_id
            data_tests: [unique, not_null]
      - name: payments
        columns:
          - name: payment_id
            data_tests: [unique, not_null]
      - name: quarantine
        description: Rows rejected by silver validation rules, with the rule they broke.
        config:
          freshness: null
