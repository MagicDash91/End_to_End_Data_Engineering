name: deploy

# Runs after ci succeeds on main (or by hand): terraform apply, then ship the commit to the EC2 host.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      vars.AWS_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform apply
        id: tf
        working-directory: infra/environments/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
          terraform apply -input=false -auto-approve -var="region=${{ vars.AWS_REGION }}"
          echo "bucket=$(terraform output -raw artifacts_bucket)" >> "$GITHUB_OUTPUT"
          echo "instance=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"

      - name: ship release to EC2
        run: bash scripts/deploy_via_ssm.sh "${{ steps.tf.outputs.bucket }}" "${{ steps.tf.outputs.instance }}" HEAD
